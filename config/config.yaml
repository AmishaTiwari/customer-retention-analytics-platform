# Customer Retention Analytics Platform — Configuration
#
# Single source of truth for all tunable values.
#
# All values in this file are loaded by the application's configuration
# module instead of being hard-coded inside the source code.
#
# STATUS (Commit 1): Structure only.
# Values will be populated in the commits where those decisions are made.
# No value should be added before it is justified by implementation.

paths:
  raw_data: data/raw
  interim_db: data/interim/retention_platform.duckdb
  processed_dataset: null # TODO (Commit 3)
  models_dir: artifacts/models
  evaluation_dir: artifacts/evaluation
  runs_dir: artifacts/runs
  outputs_dir: outputs

reproducibility:
  seed: 42

data:
  test_size: 0.2
  cv_folds: 5
  cv_repeats: 1

business:
  # k and k_sensitivity are fractions of the scored population (0.10 = 10%),
  # not percentages and not customer counts.
  k: 0.10
  k_sensitivity: [0.05, 0.10, 0.15, 0.20, 0.25]
  risk_tiers: null # TODO (Commit 9 — evaluation & error analysis)
  economics:
    arpu_proxy: null # TODO (Commit 11 — decision-support outputs)
    offer_cost: null # TODO (Commit 11)

tuning:
  budget_per_model: 30
  objective_metric: pr_auc

inference:
  input_schema: null # TODO (Commit 10)
  output_path: null # TODO (Commit 10)
