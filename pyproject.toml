[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-analytics-platform"
version = "0.1.0"
description = "Production-oriented Applied Machine Learning platform for telecom customer churn prediction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Amisha Tiwari", email = "amitiwari66@gmail.com" },
]

# No database library is included yet: the local analytical database engine
# (SQLite vs DuckDB) is an open decision deferred to a later commit and will
# be added via an ADR.
dependencies = [
    "pandas~=2.2",
    "numpy~=1.26",
    "scikit-learn~=1.6",
    "xgboost~=3.3",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov~=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
